name: RoboOps CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-train-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Dockerの自動ビルド
        run: docker compose build

      - name: 1. Ruff — code quality
        run: docker compose run --rm workshop ruff check .

      - name: Download a tiny LeRobot dataset subset
        run: docker compose run --rm workshop python src/download_dataset.py --max-episodes 20

      - name: 2. Pytest — code, Notebook, and data contracts
        run: docker compose run --rm workshop pytest -q

      - name: 3. Dataset validation
        run: docker compose run --rm workshop python src/validate_dataset.py

      - name: 4. ACTの学習経路確認
        run: docker compose run --rm workshop python src/train.py --config configs/train_ci.yaml

      - name: 5. PushTの自動評価
        run: docker compose run --rm workshop python src/eval.py --config configs/eval_ci.yaml

      - name: 6. バスケットボール Dataset生成 (人間デモ + 人間らしい合成デモ)
        run: docker compose run --rm workshop python src/generate_basketball.py --episodes 30

      - name: 7. バスケットボール Dataset validation
        run: docker compose run --rm workshop python src/validate_basketball.py --min-human 2

      - name: 8. バスケットボール ACTの学習経路確認
        run: docker compose run --rm workshop python src/train.py --config configs/train_basketball_ci.yaml

      - name: 9. バスケットボールの自動評価
        run: docker compose run --rm workshop python src/eval_basketball.py --config configs/eval_basketball_ci.yaml

      - name: Keep CI evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: roboops-ci-evidence
          path: |
            artifacts/checkpoints/lerobot-act-ci/training_metrics.json
            artifacts/evaluation/metrics-ci.json
            artifacts/dataset/basketball.json
            artifacts/checkpoints/basketball-act-ci/training_metrics.json
            artifacts/evaluation/metrics-basketball-ci.json
          if-no-files-found: warn
